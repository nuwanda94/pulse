name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev extras
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev extras
        run: pip install -e ".[dev]"
      - name: Mypy
        run: mypy app

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev extras
        run: pip install -e ".[dev]"
      - name: Pytest
        run: pytest -v --tb=short --timeout=30

  load-test:
    name: Short load-test dry-run
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev extras
        run: pip install -e ".[dev]"
      - name: Benchmark dry-run
        run: python scripts/benchmark.py --dry-run --output BENCHMARKS.md --json

  # Measured RPS/latency only on explicit manual runs (Actions → CI → Run workflow).
  # Never runs on push or pull_request. Writes BENCHMARKS.md back to the repo.
  live-benchmark:
    name: Live benchmark (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pulse
          POSTGRES_PASSWORD: pulse
          POSTGRES_DB: pulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulse -d pulse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pulse:pulse@localhost:5432/pulse
      REDIS_URL: redis://localhost:6379/0
      API_KEY_HEADER: X-API-Key
      RATE_LIMIT_REQUESTS: "100000"
      RATE_LIMIT_WINDOW_SECONDS: "60"
      LOG_LEVEL: INFO
      PULSE_API_KEY: bench-key
      PULSE_BENCH_HOST: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and dev extras
        run: pip install -e ".[dev]"
      - name: Apply migrations
        run: alembic upgrade head
      - name: Seed bench API key
        run: |
          python - <<'PY'
          import asyncio

          from app.core.security import hash_api_key
          from app.db.session import create_engine, create_session_factory
          from app.models import ApiKey

          async def main() -> None:
              engine = create_engine(
                  "postgresql+asyncpg://pulse:pulse@localhost:5432/pulse"
              )
              factory = create_session_factory(engine)
              async with factory() as session:
                  session.add(
                      ApiKey(
                          name="bench",
                          key_hash=hash_api_key("bench-key"),
                          is_admin=False,
                          is_active=True,
                      )
                  )
                  await session.commit()
              await engine.dispose()

          asyncio.run(main())
          PY
      - name: Start app
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/pulse-uvicorn.pid
      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/ready >/dev/null 2>&1; then
              echo "ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "app did not become ready"
          exit 1
      - name: Live benchmark
        run: |
          python scripts/benchmark.py \
            --live \
            --host http://127.0.0.1:8000 \
            --users 5 \
            --spawn-rate 2 \
            --time 10s \
            --api-key bench-key \
            --output BENCHMARKS.md \
            --json
      - name: Upload BENCHMARKS.md artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: BENCHMARKS.md
          if-no-files-found: error
      - name: Commit BENCHMARKS.md to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BENCHMARKS.md
          if git diff --staged --quiet; then
            echo "BENCHMARKS.md unchanged; nothing to commit"
          else
            git commit -m "chore: update BENCHMARKS.md from live CI run"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
      - name: Stop app
        if: always()
        run: |
          if [ -f /tmp/pulse-uvicorn.pid ]; then
            kill "$(cat /tmp/pulse-uvicorn.pid)" || true
          fi
